[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gam-ai"
version = "1.5.1"
description = "Micro, Local-First, Resource-Efficient AI Assistant for Android, iOS, Windows, macOS, Linux, and Tablets"
readme = "README.md"
authors = [{ name = "GAM.AI Team" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Networking"
]
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=4.0", "pyinstaller>=6.0"]
models = ["llama-cpp-python>=0.2.0"]

[project.scripts]
gam-ai = "scripts.run_app:main"
gam-ai-cli = "scripts.run_cli:main"
gam-ai-web = "scripts.run_web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gam_ai*"]

[tool.setuptools.package-data]
"gam_ai.ui" = ["*"]
