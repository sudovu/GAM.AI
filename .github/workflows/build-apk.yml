name: Build & Package GAM.AI Multi-Platform Releases

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  test:
    name: Run Python Test Suite & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Test Suite
        run: python scripts/run_tests.py

      - name: Run Performance Benchmarks
        run: python scripts/run_benchmark.py

  build-apk:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Web & PWA Assets to Android Project
        run: |
          python scripts/build_apk.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug & Release APK
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Stage Artifacts
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gam-ai-android-apk
          path: dist/*.apk
          retention-days: 30

  build-windows:
    name: Build Windows Standalone Executable
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build gam-ai.exe
        run: python scripts/build_windows_exe.py

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: gam-ai-windows-x64
          path: dist/gam-ai.exe
          retention-days: 30

  build-linux:
    name: Build Linux Standalone Binary
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build gam-ai-linux
        run: |
          pyinstaller --onefile --name gam-ai-linux-x64 \
            --add-data "gam_ai/ui:gam_ai/ui" \
            scripts/run_app.py

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: gam-ai-linux-x64
          path: dist/gam-ai-linux-x64
          retention-days: 30

  build-web-pwa:
    name: Package Cross-Platform Web & iOS PWA
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Web & iOS PWA
        run: |
          python scripts/package_all_platforms.py

      - name: Upload Web PWA
        uses: actions/upload-artifact@v4
        with:
          name: gam-ai-web-pwa
          path: dist/gam-ai-web-app.zip
          retention-days: 30

  release:
    name: Attach All Platform Artifacts to GitHub Release
    if: github.event_name == 'release'
    needs: [build-apk, build-windows, build-linux, build-web-pwa]
    runs-on: ubuntu-latest
    steps: 
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Stage Release Files
        run: |
          mkdir -p release-final
          find release-artifacts -type f -exec cp {} release-final/ \;
          ls -la release-final/

      - name: Publish All Platforms to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
